version: '3.8'
services:
  mongodb:
    image: mongo:6
    container_name: chatorijeep_mongo
    restart: always
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=food_order_system

  redis:
    image: redis:7-alpine
    container_name: chatorijeep_redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

volumes:
  mongodb_data:
  redis_data:
